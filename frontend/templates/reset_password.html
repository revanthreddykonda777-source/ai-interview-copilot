<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — AI Interview Copilot</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body>



  <!-- Reset Password Card -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <span class="auth-logo-text">AI Interview <span class="auth-accent">Copilot</span></span>
      </div>


      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Choose a strong password with at least 8 characters.</p>

      <!-- Error message from Flask -->
      {% if error %}
        <div class="auth-alert auth-alert--error">⚠️ {{ error }}</div>
      {% endif %}

      {% if token %}
      <!-- Form: user enters new password + confirmation -->
      <form method="POST" action="/reset-password" autocomplete="off" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="token" value="{{ token }}" />

        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <div class="input-wrap">
            <input id="password" type="password" name="password" class="form-input"
              placeholder="At least 8 characters" autocomplete="new-password" required style="padding-left: 16px;" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <div class="input-wrap">
            <input id="confirm_password" type="password" name="confirm_password"
              class="form-input" placeholder="Type your password again"
              autocomplete="new-password" required style="padding-left: 16px;" />
          </div>
        </div>

        <button type="submit" class="auth-btn">Reset Password →</button>
      </form>
      {% else %}
        <p class="auth-switch"><a href="/forgot-password" class="auth-link">Request a new reset link →</a></p>
      {% endif %}

      <!-- Link back to login -->
      <p class="auth-switch">
        <a href="/login" class="auth-link">← Back to Login</a>
      </p>

    </div>
  </div>

</body>
</html>
