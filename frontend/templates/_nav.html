<style>
  .app-topnav {
    max-width: 980px;
    margin: 0 auto 28px;
    padding: 12px 18px;
    background: var(--surface, #ffffff);
    border: 1px solid var(--border, #e7e2da);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 4px 14px rgba(24, 22, 20, 0.04);
  }

  .app-topnav__brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink, #181614);
  }

  .app-topnav__dot {
    width: 9px;
    height: 9px;
    border-radius: 3px;
    background: var(--accent, #c2410c);
    display: inline-block;
  }

  .app-topnav__links {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .app-topnav__link {
    text-decoration: none;
    color: var(--ink-muted, #57534e);
    font-size: 13.5px;
    font-weight: 600;
    padding: 7px 11px;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s;
  }

  .app-topnav__link:hover {
    background: var(--bg-subtle, #f3efe8);
    color: var(--ink, #181614);
  }

  .app-topnav__link--active {
    background: rgba(194, 65, 12, 0.1);
    color: var(--accent, #c2410c);
  }

  .app-topnav__logout {
    background: var(--surface, #ffffff);
    border: 1px solid var(--border-strong, #d6cfc4);
    color: var(--ink, #181614);
    padding: 7px 13px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }

  .app-topnav__logout:hover {
    background: var(--bg-subtle, #f3efe8);
    border-color: var(--ink, #181614);
  }
</style>

<nav class="app-topnav" aria-label="Main navigation">
  <a href="/dashboard" class="app-topnav__brand">
    <span class="app-topnav__dot"></span>
    <span>Interview <span style="color:var(--accent, #c2410c);">Copilot</span></span>
  </a>

  <div class="app-topnav__links">
    <a href="/" class="app-topnav__link">Practice Studio</a>
    <a href="/dashboard" class="app-topnav__link {{ 'app-topnav__link--active' if active_nav == 'dashboard' else '' }}">Dashboard</a>
    <a href="/resume" class="app-topnav__link {{ 'app-topnav__link--active' if active_nav == 'resume' else '' }}">Resume</a>
    <a href="/answer-coach" class="app-topnav__link {{ 'app-topnav__link--active' if active_nav == 'coach' else '' }}">Coach</a>
    <a href="/progress" class="app-topnav__link {{ 'app-topnav__link--active' if active_nav == 'progress' else '' }}">Progress</a>
    <a href="/profile" class="app-topnav__link {{ 'app-topnav__link--active' if active_nav == 'profile' else '' }}">Profile</a>
  </div>

  <form method="POST" action="/logout" style="margin:0;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <button type="submit" class="app-topnav__logout">Sign Out</button>
  </form>
</nav>
