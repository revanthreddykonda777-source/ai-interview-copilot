<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — AI Interview Copilot</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body>



  <!-- Forgot Password Card -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <span class="auth-logo-text">AI Interview <span class="auth-accent">Copilot</span></span>
      </div>


      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Enter your email address and we'll let you reset your password.</p>

      <!-- Error / Info message from Flask -->
      {% if error %}
        <div class="auth-alert auth-alert--error">⚠️ {{ error }}</div>
      {% endif %}
      {% if info %}
        <div class="auth-alert auth-alert--success">✅ {{ info }}</div>
      {% endif %}

      <!-- Form: user enters their email -->
      <form method="POST" action="/forgot-password" autocomplete="off" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
          <label class="form-label" for="email">Your Email Address</label>
          <div class="input-wrap">
            <input id="email" type="email" name="email" class="form-input"
              placeholder="you@example.com" autocomplete="off" required style="padding-left: 16px;" />
          </div>
        </div>

        <button type="submit" class="auth-btn">Find My Account →</button>
      </form>

      <!-- Link back to login -->
      <p class="auth-switch">
        Remember your password? <a href="/login" class="auth-link">Back to Login</a>
      </p>

    </div>
  </div>

</body>
</html>
